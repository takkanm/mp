<!doctype html>
<meta charset="utf-8">
<title>ローカルページ</title>
<body style="margin:0;display:grid;place-items:center;height:100vh;font:32px system-ui;background:#eef6ff">
  <button id="b" style="font-size:32px;padding:12px 28px">クリック: <span id="n">0</span></button>
  <script>let n = 0; b.onclick = () => (document.getElementById("n").textContent = ++n);</script>
</body>
