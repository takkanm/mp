<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>発表者ビュー</title>
  <link rel="stylesheet" href="_mp/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="_mp/style.css">
  <style id="theme"></style>
  <style id="deck-style"></style>
  <link rel="stylesheet" href="_mp/presenter.css">
</head>
<body class="presenter">
  <div class="pane current-pane">
    <div class="label">現在 <span id="page"></span></div>
    <div class="frame" id="current-frame">
      <div class="stage" id="current"></div>
      <img id="mirror" alt="聴衆画面" hidden>
    </div>
    <div id="script" hidden></div>
  </div>
  <div class="pane next-pane">
    <div class="label">次</div>
    <div class="frame" id="next-frame">
      <div class="stage" id="next"></div>
      <div id="end" hidden>最後のスライドです</div>
    </div>
  </div>
  <div class="pane notes-pane">
    <div class="label">ノート</div>
    <div id="speaker-notes"></div>
  </div>
  <div class="status">
    <span id="elapsed">00:00</span>
    <span id="slide-remaining" hidden></span>
    <span id="remaining" hidden></span>
    <span id="clock"></span>
    <span class="hints">→ 次へ ・ ← 前へ ・ Enter コマンド実行 ・ r タイマー ・ +/- ノート文字 ・ q 終了</span>
  </div>
  <script src="_mp/vendor/katex/katex.min.js"></script>
  <script src="_mp/slides.js"></script>
  <script src="_mp/presenter.js"></script>
</body>
</html>
